# Merge Zed into the channel branches (see script/sync-upstream.py):
#   daily        nightly <- Zed main, preview <- newest -pre tag
#   every 3 days main <- newest stable tag
#   manual only  experimental <- nightly, liquid-glass <- experimental (the fork's own branches:
#                merge when ready, by dispatching this workflow or with a local `update`)
# Each branch is synced by sync-branch.yml and pushed only if it builds and its tests pass.
#
# GITHUB_TOKEN cannot push commits that change .github/workflows, so workflow changes must be
# merged into every branch by hand (never let a sync merge carry them).
name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"
    # day-of-month step: runs on the 1st, 4th, ... 31st, so the gap across a month end can be 1-3 days
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      branches:
        description: Branches to sync (all = the three channels)
        type: choice
        options: [all, nightly, preview, main, experimental, liquid-glass]
        default: all

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.branches }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = "0 6 */3 * *" ]; then
            branches='["main"]'
          elif [ "$EVENT" = schedule ]; then
            branches='["nightly","preview"]'
          elif [ "$INPUT" = all ]; then
            branches='["nightly","preview","main"]'
          else
            branches="[\"$INPUT\"]"
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  sync:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    uses: ./.github/workflows/sync-branch.yml
    with:
      branch: ${{ matrix.branch }}
